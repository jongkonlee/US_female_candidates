name: update data and site

on:
  schedule:
    - cron: "37 22 * * *"   # every day 07:37 Korea time
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Re-download every source and rebuild 1990-2022 (takes longer)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "!docs/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: collect sources
        if: github.event_name != 'push'
        env:
          FULL: ${{ inputs.full_rebuild }}
        run: |
          if [ "$FULL" = "true" ]; then python pipeline/collect.py --full; else python pipeline/collect.py --daily; fi
      - name: build database and page data
        if: github.event_name != 'push'
        env:
          FULL: ${{ inputs.full_rebuild }}
        run: |
          ARGS=""
          if [ "$FULL" = "true" ]; then ARGS="--rebuild-history"; fi
          python pipeline/build_db.py $ARGS
      - name: commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "data update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: version page files   # app.js?v=… changes with the file, so browsers do not keep an old copy
        run: |
          for f in app.js style.css; do
            v=$(sha1sum "docs/$f" | cut -c1-8)
            sed -i "s#\"$f\"#\"$f?v=$v\"#" docs/index.html
          done
          grep -n "app.js\|style.css" docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 minutes (Pages can be slow during GitHub incidents)
