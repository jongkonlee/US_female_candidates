name: fetch 2026 district maps

# one-off: saves the 2026 district shapes of the states with new maps (Wikimedia Commons map data) to
# data/static/boundaries_2026; pipeline/maps.py then turns them into page map files
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch shapes
        run: python pipeline/fetch_maps_2026.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/boundaries_2026
          if ! git diff --cached --quiet; then
            git commit -m "2026 district shapes from Wikimedia Commons map data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
