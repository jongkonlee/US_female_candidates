name: analysis files (on demand)

# on demand: downloads the cumulative CES (Stata file), joins respondents to the tracker's races and fits the
# individual-level models of pipeline/ces_models.py (male candidates' race from pipeline/fetch_member_race.py); saves
# coefficients, adjusted predictions and the analysis file
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install pandas numpy scipy pyarrow pyyaml beautifulsoup4 lxml
      - name: race of members of Congress (Wikipedia lists)
        run: python pipeline/fetch_member_race.py
      - name: fit models
        run: python pipeline/ces_models.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ces data/static/ces data/static/member_race.csv data/static/member_race_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "analysis files update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # publish right away (a push of docs/data alone does not start the site deploy)
      - name: version page files
        run: |
          for f in app.js style.css; do
            v=$(sha1sum "docs/$f" | cut -c1-8)
            sed -i "s#\"$f\"#\"$f?v=$v\"#" docs/index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
