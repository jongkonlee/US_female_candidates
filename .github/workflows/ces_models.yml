name: CES individual models

# on demand: downloads the cumulative CES (Stata file), joins respondents to the tracker's races and fits the
# individual-level models of pipeline/ces_models.py; saves coefficients, adjusted predictions and the analysis file
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install pandas numpy scipy pyarrow
      - name: fit models
        run: python pipeline/ces_models.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ces data/static/ces
          if ! git diff --cached --quiet; then
            git commit -m "CES individual models"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
