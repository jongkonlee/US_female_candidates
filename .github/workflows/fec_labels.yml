name: fetch FEC ballot labels

# on demand (once): ballot-line labels of candidates with no D or R line in the FEC result workbooks 2002-2022
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: read FEC workbooks
        run: python pipeline/fec_ballot_labels.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/fec_ballot_labels.csv
          if ! git diff --cached --quiet; then
            git commit -m "FEC ballot labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
